<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Route Map | K-Spot Trend</title>
  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
  <link rel="stylesheet" href="./css/style.css" />
  <style>
    .map-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-top: 4px solid var(--palace-crimson);
      border-radius: var(--radius-lg);
      padding: 2rem;
      box-shadow: 0 12px 30px -10px rgba(31, 32, 34, 0.08);
      margin-top: 2rem;
    }

    .city-nav-chips {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 2rem;
    }

    .route-visualizer {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      padding: 1.5rem;
      background: #fdfbf7;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      margin-bottom: 2rem;
    }

    .route-step {
      display: flex;
      align-items: flex-start;
      gap: 1.25rem;
      position: relative;
    }

    .route-step:not(:last-child)::after {
      content: '';
      position: absolute;
      left: 17px;
      top: 36px;
      bottom: -18px;
      width: 2px;
      border-left: 2px dashed var(--palace-gold);
    }

    .step-number {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--palace-crimson);
      color: #fff;
      font-weight: 800;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      z-index: 1;
    }

    .step-content {
      flex: 1;
      padding-top: 0.2rem;
    }

    .step-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--palace-indigo);
    }

    .step-info {
      font-size: 0.88rem;
      color: var(--text-sub);
      margin-top: 0.25rem;
    }

    .transit-badge {
      display: inline-block;
      margin-top: 0.4rem;
      padding: 0.2rem 0.6rem;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--palace-pine);
      background: #eef7f4;
      border-radius: 4px;
    }

    .map-external-links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .external-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.9rem;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 700;
      border: 1px solid var(--border-color);
      background: #fff;
      color: var(--text-main);
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .external-btn:hover {
      border-color: var(--palace-crimson);
      color: var(--palace-crimson);
      background: #fdfbf7;
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a href="./index.html" class="nav-brand">🏯 K-Spot Trend</a>
    <ul class="nav-menu">
      <li><a href="./index.html" class="nav-link" data-i18n="nav_ai">AI 코스 추천</a></li>
      <li><a href="./spots.html" class="nav-link" data-i18n="nav_spots">로컬 핫플</a></li>
      <li><a href="./map.html" class="nav-link active" data-i18n="nav_map">동선 지도</a></li>
      <li><a href="./guide.html" class="nav-link" data-i18n="nav_guide">여행 가이드</a></li>
      <li><a href="./saved.html" class="nav-link" data-i18n="nav_saved">내 보관함</a></li>
    </ul>

    <button type="button" id="lang-toggle-btn" class="lang-btn">EN</button>
  </nav>

  <div class="app-container">
    <header class="site-header">
      <div class="site-badge" data-i18n="map_badge">🗺️ 여행 동선 시각화</div>
      <h1 class="site-title" data-i18n="map_title">추천 1일 여행 서킷</h1>
      <p class="site-desc" data-i18n="map_desc">도시별 랜드마크를 대중교통으로 매끄럽게 잇는 1일 최적 동선입니다.</p>
    </header>

    <div class="city-nav-chips">
      <button type="button" class="chip-btn active" data-city="gangneung" data-i18n="map_tab_gn">강릉 서킷</button>
      <button type="button" class="chip-btn" data-city="gyeongju" data-i18n="map_tab_gj">경주 서킷</button>
      <button type="button" class="chip-btn" data-city="andong" data-i18n="map_tab_ad">안동 서킷</button>
    </div>

    <div class="map-wrapper">
      <div id="route-container" class="route-visualizer"></div>

      <div style="border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
        <h4 style="font-size: 0.9rem; font-weight: 800; color: var(--palace-indigo); margin-bottom: 0.5rem;" data-i18n="map_nav_title">
          📌 추천 내비게이션으로 바로 길찾기:
        </h4>
        <div class="map-external-links">
          <a href="https://map.naver.com" target="_blank" rel="noopener noreferrer" class="external-btn" data-i18n="map_btn_naver">
            🟢 네이버 지도 열기 (국내 최적화)
          </a>
          <a href="https://map.kakao.com" target="_blank" rel="noopener noreferrer" class="external-btn" data-i18n="map_btn_kakao">
            🟡 카카오맵 열기 (실시간 버스)
          </a>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { setupLanguageToggle, getCurrentLang } from './js/lang.js';

    const routesData = {
      ko: {
        gangneung: [
          { title: "강릉 KTX역", info: "KTX 고속철도 허브에서 여정 시작", transit: "🚖 택시 20분 / 300번 버스" },
          { title: "주문진 BTS 버스정류장", info: "방탄소년단 'You Never Walk Alone' 앨범 재킷 촬영지", transit: "🚌 해안 버스 25분" },
          { title: "사천해변 & 숲 카페", info: "소나무 숲과 백사장 사이에 숨겨진 아티장 베이커리", transit: "🚖 차량 15분" },
          { title: "안목해변 커피거리", info: "동해 바다 일몰이 파노라마로 펼쳐지는 루프탑 카페", transit: "🏁 투어 완료" }
        ],
        gyeongju: [
          { title: "신경주 KTX역", info: "천년 고도 신라의 관문 도착", transit: "🚌 좌석버스 700번 20분" },
          { title: "황리단길 한옥 골목", info: "보존된 한옥을 개조한 감성 카페 및 디저트 거리", transit: "🚶 도보 10분" },
          { title: "대릉원 고분군", info: "신라 고분 능선 사이 목련 포토스팟", transit: "🚶 저녁 산책 15분" },
          { title: "동궁과 월지 (안압지)", info: "물 위에 반사되는 화려한 야경 궁궐 누각", transit: "🏁 투어 완료" }
        ],
        andong: [
          { title: "안동 KTX역", info: "전통 유교 문화의 고장으로의 입구", transit: "🚌 210번 버스 40분" },
          { title: "안동 하회마을", info: "유네스코 세계문화유산 및 하회별신굿탈놀이 전승지", transit: "⛵ 나룻배 + 10분 등산" },
          { title: "부용대 절벽", info: "낙동강이 연꽃 모양으로 감싸 안은 하회마을 조망대", transit: "🚌 35분 버스 이동" },
          { title: "안동 찜닭 골목", info: "특제 간장 양념과 당면이 어우러진 원조 찜닭 미식", transit: "🏁 투어 완료" }
        ]
      },
      en: {
        gangneung: [
          { title: "Gangneung KTX Station", info: "Start your journey at the high-speed rail hub", transit: "🚖 20 min taxi / Bus #300" },
          { title: "Jumunjin BTS Bus Stop", info: "Iconic oceanfront photo spot (BTS 'You Never Walk Alone')", transit: "🚌 25 min scenic coastal bus" },
          { title: "Sacheon Beach & Forest Cafe", info: "Artisan bakeries tucked between pine groves and white sand", transit: "🚖 15 min ride" },
          { title: "Anmok Coffee Street", info: "Rooftop espresso with panoramic sunset views over East Sea", transit: "🏁 Tour Complete" }
        ],
        gyeongju: [
          { title: "Singyeongju KTX Station", info: "Arrival at the ancient Millennium capital", transit: "🚌 20 min via City Express #700" },
          { title: "Hwangridan-gil Hanok Alleys", info: "Modern cafe culture inside preserved Joseon-style hanoks", transit: "🚶 10 min walking route" },
          { title: "Daereungwon Ancient Tombs", info: "Iconic photo point between historic Silla royal mounds", transit: "🚶 15 min evening stroll" },
          { title: "Donggung Palace & Wolji Pond", info: "Breathtaking royal pavilion lighting reflections on water", transit: "🏁 Tour Complete" }
        ],
        andong: [
          { title: "Andong KTX Station", info: "Gateway to classic Confucian heritage", transit: "🚌 40 min via Bus #210" },
          { title: "Hahoe Folk Village", info: "UNESCO World Heritage site with live mask dance traditions", transit: "⛵ River Ferry + 10 min hike" },
          { title: "Buyongdae Cliff", info: "Overlook showing the full river-embraced lotus shape of the village", transit: "🚌 35 min return bus" },
          { title: "Andong Jjimdak Market Alley", info: "Famous steaming soy-glazed savory chicken feast", transit: "🏁 Tour Complete" }
        ]
      }
    };

    let currentCity = 'gangneung';

    function renderRoute() {
      const lang = getCurrentLang() || 'ko';
      const container = document.getElementById('route-container');
      const steps = routesData[lang]?.[currentCity] || routesData['en'][currentCity] || [];

      container.innerHTML = steps.map((s, idx) => `
        <div class="route-step">
          <div class="step-number">${idx + 1}</div>
          <div class="step-content">
            <div class="step-title">${s.title}</div>
            <div class="step-info">${s.info}</div>
            <span class="transit-badge">${s.transit}</span>
          </div>
        </div>
      `).join('');
    }

    document.querySelectorAll('.city-nav-chips .chip-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.city-nav-chips .chip-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCity = btn.getAttribute('data-city');
        renderRoute();
      });
    });

    document.addEventListener('DOMContentLoaded', () => {
      setupLanguageToggle();
      renderRoute();

      // 토글 버튼 클릭 시 동선 카드도 함께 리렌더링
      const toggleBtn = document.getElementById('lang-toggle-btn');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          setTimeout(renderRoute, 50);
        });
      }
    });
  </script>
</body>
</html>
