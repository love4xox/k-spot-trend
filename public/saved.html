<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Saved Routes | K-Spot Trend</title>
  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
  <link rel="stylesheet" href="./css/style.css" />
  <style>
    .saved-list-container {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .saved-item-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--palace-crimson);
      border-radius: var(--radius-md);
      padding: 1.75rem;
      box-shadow: 0 4px 12px rgba(31, 32, 34, 0.04);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1.5rem;
    }

    .saved-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--palace-indigo);
      margin-bottom: 0.35rem;
    }

    .saved-meta {
      font-size: 0.85rem;
      color: var(--palace-gold);
      font-weight: 700;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
    }

    .saved-spots-summary {
      font-size: 0.92rem;
      color: var(--text-sub);
      line-height: 1.5;
    }

    .action-group {
      display: flex;
      gap: 0.6rem;
      flex-shrink: 0;
    }

    .btn-delete {
      padding: 0.5rem 0.9rem;
      font-size: 0.82rem;
      font-weight: 700;
      color: #dc2626;
      border: 1px solid #fee2e2;
      background: #fef2f2;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-delete:hover {
      background: #fee2e2;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      background: var(--bg-card);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-lg);
      margin-top: 2rem;
    }

    .empty-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .empty-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--palace-indigo);
      margin-bottom: 0.5rem;
    }

    .empty-desc {
      font-size: 0.92rem;
      color: var(--text-sub);
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <!-- GNB 내비게이션 -->
  <nav class="site-nav">
    <a href="./index.html" class="nav-brand">🏯 K-Spot Trend</a>
    <ul class="nav-menu">
      <li><a href="./index.html" class="nav-link" data-i18n="nav_ai">AI 코스 추천</a></li>
      <li><a href="./spots.html" class="nav-link" data-i18n="nav_spots">로컬 핫플</a></li>
      <li><a href="./map.html" class="nav-link" data-i18n="nav_map">동선 지도</a></li>
      <li><a href="./guide.html" class="nav-link" data-i18n="nav_guide">여행 가이드</a></li>
      <li><a href="./saved.html" class="nav-link active" data-i18n="nav_saved">내 보관함</a></li>
    </ul>

    <!-- 언어 전환 버튼 -->
    <button type="button" id="lang-toggle-btn" class="lang-btn">EN</button>
  </nav>

  <div class="app-container">
    <header class="site-header">
      <div class="site-badge" data-i18n="saved_badge">📌 나만의 북마크</div>
      <h1 class="site-title" data-i18n="saved_title">저장된 여행 코스</h1>
      <p class="site-desc" data-i18n="saved_desc">AI가 추천해 준 코스 중 마음에 드는 일정을 오프라인으로 보관하세요.</p>
    </header>

    <div id="saved-container" class="saved-list-container">
      <!-- 동적 렌더링 영역 -->
    </div>
  </div>

  <script type="module">
    import { setupLanguageToggle, getCurrentLang } from './js/lang.js';

    const defaultSaved = [
      {
        id: "route-1",
        city_ko: "강릉",
        city_en: "Gangneung",
        theme_ko: "K-Pop 오션 브리즈 감성 투어",
        theme_en: "K-Pop Ocean Breeze Tour",
        date: "2026-03-01",
        spots_ko: "주문진 BTS 버스정류장 ➔ 사천해변 ➔ 안목해변 커피거리",
        spots_en: "Jumunjin BTS Bus Stop ➔ Sacheon Beach ➔ Anmok Coffee Street"
      },
      {
        id: "route-2",
        city_ko: "경주",
        city_en: "Gyeongju",
        theme_ko: "천년 신라 감성 달빛 야경 산책",
        theme_en: "Timeless Silla Night Walk",
        date: "2026-03-02",
        spots_ko: "황리단길 한옥 골목 ➔ 대릉원 ➔ 동궁과 월지",
        spots_en: "Hwangridan-gil Alleys ➔ Daereungwon ➔ Donggung Palace & Wolji Pond"
      }
    ];

    function loadSavedRoutes() {
      const container = document.getElementById('saved-container');
      const lang = getCurrentLang() || 'ko';
      const savedData = JSON.parse(localStorage.getItem('kspot_saved_routes')) || defaultSaved;

      if (!savedData || savedData.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📂</div>
            <h3 class="empty-title">${lang === 'ko' ? '저장된 코스가 없습니다' : 'No Saved Routes Yet'}</h3>
            <p class="empty-desc">${lang === 'ko' ? '메인 화면에서 맞춤 1일 코스를 생성하고 북마크해 보세요.' : 'Generate an AI course on the main page and bookmark it to review later.'}</p>
            <a href="./index.html" class="submit-btn" style="display: inline-block; width: auto; padding: 0.75rem 1.5rem; text-decoration: none;">
              ${lang === 'ko' ? '코스 추천받으러 가기 ✨' : 'Go to AI Curator ✨'}
            </a>
          </div>
        `;
        return;
      }

      const isKo = lang === 'ko';
      container.innerHTML = savedData.map(item => {
        const cityName = isKo ? (item.city_ko || item.city) : (item.city_en || item.city);
        const themeTitle = isKo ? (item.theme_ko || item.theme) : (item.theme_en || item.theme);
        const spotsText = isKo ? (item.spots_ko || item.spots) : (item.spots_en || item.spots);
        const metaSavedText = isKo ? '저장일' : 'Saved on';
        const removeText = isKo ? '삭제' : 'Remove';

        return `
          <article class="saved-item-card" id="${item.id}">
            <div>
              <div class="saved-meta">${cityName} • ${metaSavedText} ${item.date}</div>
              <h3 class="saved-title">${themeTitle}</h3>
              <p class="saved-spots-summary">📍 ${spotsText}</p>
            </div>
            <div class="action-group">
              <button class="btn-delete" data-id="${item.id}">${removeText}</button>
            </div>
          </article>
        `;
      }).join('');

      // 삭제 버튼 이벤트 바인딩
      container.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const targetId = e.target.getAttribute('data-id');
          deleteRoute(targetId);
        });
      });
    }

    function deleteRoute(id) {
      let savedData = JSON.parse(localStorage.getItem('kspot_saved_routes')) || defaultSaved;
      savedData = savedData.filter(item => item.id !== id);
      localStorage.setItem('kspot_saved_routes', JSON.stringify(savedData));
      loadSavedRoutes();
    }

    document.addEventListener('DOMContentLoaded', () => {
      setupLanguageToggle();
      loadSavedRoutes();

      // 언어 토글 시 저장 목록 실시간 언어 갱신
      const toggleBtn = document.getElementById('lang-toggle-btn');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          setTimeout(loadSavedRoutes, 50);
        });
      }
    });
  </script>
</body>
</html>
