<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Saved Routes | K-Spot Trend</title>
  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
  <link rel="stylesheet" href="./css/style.css" />
  <style>
    .saved-list-container {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .saved-item-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--palace-crimson);
      border-radius: var(--radius-md);
      padding: 1.75rem;
      box-shadow: 0 4px 12px rgba(31, 32, 34, 0.04);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1.5rem;
    }

    .saved-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--palace-indigo);
      margin-bottom: 0.35rem;
    }

    .saved-meta {
      font-size: 0.85rem;
      color: var(--palace-gold);
      font-weight: 700;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
    }

    .saved-spots-summary {
      font-size: 0.92rem;
      color: var(--text-sub);
      line-height: 1.5;
    }

    .action-group {
      display: flex;
      gap: 0.6rem;
      flex-shrink: 0;
    }

    .btn-delete {
      padding: 0.5rem 0.9rem;
      font-size: 0.82rem;
      font-weight: 700;
      color: #dc2626;
      border: 1px solid #fee2e2;
      background: #fef2f2;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-delete:hover {
      background: #fee2e2;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      background: var(--bg-card);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-lg);
      margin-top: 2rem;
    }

    .empty-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .empty-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--palace-indigo);
      margin-bottom: 0.5rem;
    }

    .empty-desc {
      font-size: 0.92rem;
      color: var(--text-sub);
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <!-- GNB 내비게이션 -->
  <nav class="site-nav">
    <a href="./index.html" class="nav-brand">🏯 K-Spot Trend</a>
    <ul class="nav-menu">
      <li><a href="./index.html" class="nav-link" data-i18n="nav_ai">AI Curator</a></li>
      <li><a href="./spots.html" class="nav-link" data-i18n="nav_spots">Spots Gallery</a></li>
      <li><a href="./map.html" class="nav-link" data-i18n="nav_map">Interactive Map</a></li>
      <li><a href="./guide.html" class="nav-link" data-i18n="nav_guide">Travel Guide</a></li>
      <li><a href="./saved.html" class="nav-link active" data-i18n="nav_saved">My Routes</a></li>
    </ul>

    <!-- 언어 전환 버튼 -->
    <button type="button" id="lang-toggle-btn" class="lang-btn">EN</button>
  </nav>

  <div class="app-container">
    <header class="site-header">
      <div class="site-badge" data-i18n="saved_badge">📌 Bookmarks</div>
      <h1 class="site-title" data-i18n="saved_title">Saved Curations</h1>
      <p class="site-desc" data-i18n="saved_desc">Your favorite AI-generated local itineraries saved offline on your device.</p>
    </header>

    <div id="saved-container" class="saved-list-container">
      <!-- 동적 렌더링 영역 -->
    </div>
  </div>

  <script>
    const initialSaved = [
      {
        id: "route-1",
        city: "Gangneung",
        theme: "K-Pop Ocean Breeze Tour",
        date: "2026-03-01",
        spots: "Jumunjin BTS Bus Stop ➔ Sacheon Beach ➔ Anmok Coffee Street"
      },
      {
        id: "route-2",
        city: "Gyeongju",
        theme: "Timeless Silla Night Walk",
        date: "2026-03-02",
        spots: "Hwangridan-gil Alleys ➔ Daereungwon ➔ Donggung Palace & Wolji Pond"
      }
    ];

    function loadSavedRoutes() {
      const container = document.getElementById('saved-container');
      const savedData = JSON.parse(localStorage.getItem('kspot_saved_routes')) || initialSaved;

      if (!savedData || savedData.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📂</div>
            <h3 class="empty-title">No Saved Routes Yet</h3>
            <p class="empty-desc">Generate an AI course on the main page and bookmark it to review later.</p>
            <a href="./index.html" class="submit-btn" style="display: inline-block; width: auto; padding: 0.75rem 1.5rem; text-decoration: none;">
              Go to AI Curator ✨
            </a>
          </div>
        `;
        return;
      }

      container.innerHTML = savedData.map(item => `
        <article class="saved-item-card" id="${item.id}">
          <div>
            <div class="saved-meta">${item.city} • Saved on ${item.date}</div>
            <h3 class="saved-title">${item.theme}</h3>
            <p class="saved-spots-summary">📍 ${item.spots}</p>
          </div>
          <div class="action-group">
            <button class="btn-delete" onclick="deleteRoute('${item.id}')">Remove</button>
          </div>
        </article>
      `).join('');
    }

    function deleteRoute(id) {
      let savedData = JSON.parse(localStorage.getItem('kspot_saved_routes')) || initialSaved;
      savedData = savedData.filter(item => item.id !== id);
      localStorage.setItem('kspot_saved_routes', JSON.stringify(savedData));
      loadSavedRoutes();
    }

    loadSavedRoutes();
  </script>

  <!-- 다국어 지원 연동 스크립트 -->
  <script type="module">
    import { setupLanguageToggle } from './js/lang.js';
    document.addEventListener('DOMContentLoaded', setupLanguageToggle);
  </script>
</body>
</html>
