<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232F"/>
      <stop offset="60%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#0A0C10"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2D06B"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
  </defs>

  <!-- 배경 테두리 및 종이 질감 -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect x="30" y="30" width="1140" height="570" rx="16" fill="none" stroke="#C59B27" stroke-width="1.5" opacity="0.3"/>
  
  <!-- 상단 카테고리 뱃지 -->
  <g transform="translate(100, 110)">
    <rect width="270" height="42" rx="21" fill="#8B1E1E"/>
    <text x="135" y="26" fill="#FDFBF7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1.5">⚡ K-CULTURE &amp; MZ HOTSPOTS</text>
  </g>

  <!-- 메인 타이틀 -->
  <text x="100" y="235" fill="#FDFBF7" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif" font-size="62" font-weight="900" letter-spacing="-1">
    K-Spot Trend
  </text>
  <text x="100" y="305" fill="url(#gold-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif" font-size="34" font-weight="700">
    한국의 숨은 트렌드를 걷다
  </text>

  <!-- 서브 설명 -->
  <text x="100" y="375" fill="#A8B0BF" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif" font-size="22" font-weight="400">
    뻔한 관광지 대신, 현지인이 직접 검증한 1일 감성 코스와 포토존 동선
  </text>

  <!-- 기능 태그 칩들 -->
  <g transform="translate(100, 445)">
    <rect x="0" y="0" width="165" height="44" rx="8" fill="#252C3B" stroke="#3A4459" stroke-width="1"/>
    <text x="82.5" y="28" fill="#FDFBF7" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" text-anchor="middle">AI 1-Day Curator</text>

    <rect x="180" y="0" width="165" height="44" rx="8" fill="#252C3B" stroke="#3A4459" stroke-width="1"/>
    <text x="262.5" y="28" fill="#FDFBF7" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Route Circuit Map</text>

    <rect x="360" y="0" width="165" height="44" rx="8" fill="#252C3B" stroke="#3A4459" stroke-width="1"/>
    <text x="442.5" y="28" fill="#FDFBF7" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Multilingual KR / EN</text>
  </g>

  <!-- 우측 장식 그래픽 (궁궐 지붕 실루엣 + 핀) -->
  <g transform="translate(860, 220)">
    <circle cx="120" cy="120" r="160" fill="#8B1E1E" opacity="0.15"/>
    <circle cx="120" cy="120" r="110" fill="#C59B27" opacity="0.1"/>
    <!-- 기와 아이콘 -->
    <path d="M50 130 C 90 130, 110 95, 120 85 C 130 95, 150 130, 190 130 C 180 138, 170 142, 160 142 L 80 142 C 70 142, 60 138, 50 130 Z" fill="#C59B27"/>
    <rect x="75" y="146" width="90" height="12" rx="2" fill="#FDFBF7"/>
    <path d="M85 162 L85 200 L155 200 L155 162 Z" fill="#FDFBF7" opacity="0.8"/>
    <!-- 스파클 포인트 -->
    <path d="M170 60 Q 185 80, 205 80 Q 185 80, 170 100 Q 155 80, 135 80 Q 155 80, 170 60 Z" fill="#F2D06B"/>
  </g>
</svg>
